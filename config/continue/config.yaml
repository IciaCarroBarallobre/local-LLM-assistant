name: Local AI Assistant
version: 0.0.1
schema: v1

# ==========================================================
# Models
# ==========================================================

models:

  # General-purpose coding model
  - name: Qwen 3
    provider: ollama
    model: qwen3:8b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit

  # Main coding model
  - name: Qwen 2.5 Coder
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    roles:
      - chat
      - edit
      - apply
      - autocomplete

  # Embedding model for project knowledge
  - name: Nomic Embed
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: http://localhost:11434
    roles:
      - embed


# ==========================================================
# MCP Servers
# ==========================================================

mcpServers:

  # --------------------------------------------------------
  # WEB
  # --------------------------------------------------------

  # Search the web and documentation.
  - name: Exa
    type: streamable-http
    url: https://mcp.exa.ai/mcp
    apiKey: ${{ secrets.EXA_API_KEY }}
    connectionTimeout: 30000

  # Read the contents of a specific URL.
  - name: Fetch
    command: uvx
    args:
      - mcp-server-fetch


  # --------------------------------------------------------
  # GIT
  # --------------------------------------------------------

  # Work with the local Git repository:
  # status, diff, log, branches, commits, etc.
  - name: Git
    command: uvx
    args:
      - mcp-server-git
      - --repository
      - .

# ==========================================================
