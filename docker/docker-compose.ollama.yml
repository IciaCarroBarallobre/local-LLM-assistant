services:

  # ==========================================================
  # Ollama
  # ==========================================================
  #
  # Ollama runs inside Docker on Linux.
  #
  # macOS does NOT load this file.
  # Ollama runs natively using Metal instead.
  #

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-service
    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama-data:/root/.ollama

    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}

    deploy:
      resources:
        limits:
          cpus: "${OLLAMA_CPUS}"
          memory: "${OLLAMA_MEMORY}"


# ==========================================================
# Persistent volumes
# ==========================================================

volumes:

  ollama-data:
